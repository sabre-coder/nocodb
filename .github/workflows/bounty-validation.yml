name: Saved view record count validation

# Install this workflow on the fork's default branch; checkout selects the feature below.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit in this fork to validate
        required: true
        default: feat/saved-view-record-counts
        type: string

permissions:
  contents: read

concurrency:
  group: saved-view-record-count-validation-${{ inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  HUSKY: '0'
  NUXT_TELEMETRY_DISABLED: '1'

jobs:
  focused-tests:
    # Standard hosted runners are free for this public fork. Skip if it becomes private.
    if: github.repository == 'sabre-coder/nocodb' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Record tested revision
        run: git rev-parse HEAD | tee "$RUNNER_TEMP/bounty-validation-tests.log"

      - name: Install the focused test harness
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix "$RUNNER_TEMP/bounty-test-tools" --no-audit --no-fund --save-exact \
            vitest@3.0.7 vite@6.4.3 @vitejs/plugin-vue@5.2.1 \
            vue@3.5.14 @vue/compiler-sfc@3.5.14 @vue/test-utils@2.4.6 \
            @vueuse/core@10.11.1 pinia@2.3.1 happy-dom@20.0.0 \
            axios@1.16.0 typescript@5.8.3 \
            2>&1 | tee -a "$RUNNER_TEMP/bounty-validation-tests.log"

      - name: Configure isolated Vue tests against the checked-out source
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const tools = path.join(process.env.RUNNER_TEMP, 'bounty-test-tools')
          const gui = path.join(process.env.GITHUB_WORKSPACE, 'packages/nc-gui')
          const sdk = path.join(process.env.GITHUB_WORKSPACE, 'packages/nocodb-sdk/src/lib')
          // Export the actual SDK enums and role parser used by these tests without building unrelated SDK code.
          fs.writeFileSync(path.join(tools, 'sdk-enums.ts'), [
            `export * from ${JSON.stringify(path.join(sdk, 'globals'))}`,
            `export * from ${JSON.stringify(path.join(sdk, 'enums'))}`,
            `export { extractRolesObj } from ${JSON.stringify(path.join(sdk, 'helperFunctions'))}`,
          ].join('\n'))
          fs.writeFileSync(path.join(tools, 'vitest.config.mjs'), `
            import { defineConfig } from 'vitest/config'
            import Vue from '@vitejs/plugin-vue'
            export default defineConfig({
              root: ${JSON.stringify(gui)},
              plugins: [Vue()],
              esbuild: { tsconfigRaw: '{}' },
              resolve: { alias: ${JSON.stringify({
                'nocodb-sdk': path.join(tools, 'sdk-enums.ts'),
                '~/lib/is': path.join(sdk, 'is.ts'),
                '~/lib/globals': path.join(sdk, 'globals.ts'),
                '~': gui,
              })} },
              test: {
                environment: 'happy-dom',
                include: ['test/view-record-count*.test.ts'],
              },
            })
          `)
          fs.symlinkSync(path.join(tools, 'node_modules'), path.join(gui, 'node_modules'), 'dir')
          fs.symlinkSync(path.join(tools, 'node_modules'), path.join(process.env.GITHUB_WORKSPACE, 'packages/nocodb-sdk/node_modules'), 'dir')
          NODE

      - name: Run the 30 focused view count tests
        run: |
          "$RUNNER_TEMP/bounty-test-tools/node_modules/.bin/vitest" run \
            --config "$RUNNER_TEMP/bounty-test-tools/vitest.config.mjs" \
            --reporter=verbose 2>&1 | tee -a "$RUNNER_TEMP/bounty-validation-tests.log"

      - name: Keep failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: saved-view-record-count-test-logs
          path: ${{ runner.temp }}/bounty-validation-tests.log
          retention-days: 3
          if-no-files-found: ignore

  production-build:
    if: github.repository == 'sabre-coder/nocodb' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=10240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        with:
          version: '10'
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Record revision and use the CI-managed Node version
        run: |
          git rev-parse HEAD | tee "$RUNNER_TEMP/bounty-validation-build.log"
          node --version | tee -a "$RUNNER_TEMP/bounty-validation-build.log"
          pnpm --version | tee -a "$RUNNER_TEMP/bounty-validation-build.log"
          # Matches the upstream Jest workflow: setup-node already supplied this exact version.
          sed -i '/^use-node-version=/d' .npmrc

      - name: Install SDK dependencies from the workspace lockfile
        run: |
          pnpm --filter nocodb-sdk --filter nocodb-sdk-v2 install --frozen-lockfile \
            2>&1 | tee -a "$RUNNER_TEMP/bounty-validation-build.log"

      - name: Generate and build the main SDK
        working-directory: packages/nocodb-sdk
        run: |
          # These are generate:sdk's commands, separated so its trailing `; rm` cannot hide a generator failure.
          node build-script/mergeAndGenerateSwaggerCE 2>&1 | tee -a "$RUNNER_TEMP/bounty-validation-build.log"
          pnpm dlx swagger-typescript-api@10.0.3 -r -p ./nc_swagger.json -o ./src/lib/ \
            --axios --unwrap-response-data --module-name-first-tag --type-suffix=Type \
            --templates ../../scripts/sdk/templates \
            2>&1 | tee -a "$RUNNER_TEMP/bounty-validation-build.log"
          pnpm run build:main 2>&1 | tee -a "$RUNNER_TEMP/bounty-validation-build.log"
          pnpm run build:module 2>&1 | tee -a "$RUNNER_TEMP/bounty-validation-build.log"

      - name: Generate and build SDK v2
        run: |
          pnpm --filter nocodb-sdk-v2 run generate:sdk 2>&1 | tee -a "$RUNNER_TEMP/bounty-validation-build.log"
          pnpm --filter nocodb-sdk-v2 run build 2>&1 | tee -a "$RUNNER_TEMP/bounty-validation-build.log"

      - name: Install frontend dependencies and prepare Nuxt
        run: |
          # nc-gui's postinstall invokes nuxt prepare; the SDK artifacts now exist.
          pnpm --filter nc-gui install --frozen-lockfile \
            2>&1 | tee -a "$RUNNER_TEMP/bounty-validation-build.log"

      - name: Build the full frontend for production
        env:
          NODE_ENV: production
        run: |
          # nc-gui does not declare a package.json build script.
          pnpm --filter nc-gui exec nuxt build 2>&1 | tee -a "$RUNNER_TEMP/bounty-validation-build.log"

      - name: Keep failed production build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: saved-view-record-count-build-logs
          path: ${{ runner.temp }}/bounty-validation-build.log
          retention-days: 3
          if-no-files-found: ignore
